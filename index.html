<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friendly Roast Generator 😂</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#ff9800,#ff4081);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    width:90%;
    max-width:420px;
    padding:25px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{
    color:#ff4081;
}

input{
    width:90%;
    padding:12px;
    border-radius:10px;
    border:2px solid #ddd;
    font-size:16px;
}

button{
    margin-top:15px;
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:#ff4081;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#e91e63;
}

#roast{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
    color:#333;
    min-height:80px;
}
</style>
</head>

<body>

<div class="card">
<h1>😂 Friendly Roast Generator</h1>

<input id="name" placeholder="Enter your name">

<br>

<button onclick="roastMe()">🔥 Roast Me</button>

<div id="roast">
Your roast will appear here...
</div>

</div>

<script>

const roasts=[
"Your phone battery deserves an award for surviving your screen time. 🔋😂",
"You say 'I'll do it tomorrow' like it's a life motto. 😆",
"You're so lucky... even your alarm gives up on you. ⏰😂",
"Your search history could become a comedy show. 🤣",
"You open the fridge every 10 minutes hoping food magically appears. 🍕😂",
"You're not lazy... you're on maximum power-saving mode. 😴",
"Your Wi-Fi disconnects just to get some peace. 📶😂",
"If overthinking burned calories, you'd be a fitness legend. 🧠😂",
"You're the CEO of 'One More Episode'. 📺🤣",
"Even Google gets confused by your questions sometimes. 😂"
];

function roastMe(){

let name=document.getElementById("name").value.trim();

if(name===""){
name="Friend";
}

let random=roasts[Math.floor(Math.random()*roasts.length)];

document.getElementById("roast").innerHTML=
"😂 <b>"+name+"</b>,<br><br>"+random;

}

</script>

</body>
</html>
