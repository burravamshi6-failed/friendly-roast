<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Friendly Roast</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#6a11cb,#2575fc);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{background:#fff;max-width:520px;width:100%;padding:24px;border-radius:18px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#roast{background:#f2f2f2;padding:18px;border-radius:12px;min-height:70px;margin:16px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
button{padding:12px 18px;border:none;border-radius:10px;background:#2575fc;color:#fff;font-size:16px;cursor:pointer}
.bar{height:12px;background:#ddd;border-radius:6px;overflow:hidden}.fill{height:100%;width:0;background:#36c}
</style></head><body>
<div class="card">
<h1>🔥 Friendly Roast</h1>
<div class="bar"><div id="fill" class="fill"></div></div>
<p id="meter">Roast Meter: 0%</p>
<div id="roast">Press Roast Me!</div>
<div class="row">
<button id="b1">🎲 Roast Me</button>
<button id="b2">📋 Copy</button>
<button id="b3">📤 Share</button>
</div>
</div>
<script>
const roasts=["You're on battery saver mode.","Your Wi‑Fi has more confidence than you.","Even autocorrect needs a vacation from you.","You're the CEO of accidental comedy.","You make Mondays look exciting."];
const roast=document.getElementById('roast'),fill=document.getElementById('fill'),meter=document.getElementById('meter');
document.getElementById('b1').onclick=()=>{const t=roasts[Math.floor(Math.random()*roasts.length)];roast.textContent=t;const m=Math.floor(Math.random()*101);fill.style.width=m+"%";meter.textContent="Roast Meter: "+m+"%";}
document.getElementById('b2').onclick=()=>navigator.clipboard.writeText(roast.textContent).then(()=>alert("Copied!"));
document.getElementById('b3').onclick=()=>{if(navigator.share){navigator.share({text:roast.textContent});}else{alert("Share not supported.");}}
</script></body></html>
